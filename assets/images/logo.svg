<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&amp;family=Inter:wght@700&amp;display=swap');
      .logo-title-main {
        font-family: 'Poppins', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 21px;
        fill: #1B5E20;
        letter-spacing: -0.2px;
      }
      .logo-title-sub {
        font-family: 'Poppins', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #2E7D32;
        letter-spacing: 3.5px;
      }
    </style>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B5E20" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(5, 5)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="28" fill="#F0F9F1"/>
    <circle cx="30" cy="30" r="25" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <path d="M30 6 C39 16 45 27 45 35 C45 44 39 51 30 54 C21 51 15 44 15 35 C15 27 21 16 30 6 Z" fill="url(#leafGrad)"/>
    <path d="M30 51 V 22 C30 22 37 26 37 34 C37 41 30 51 30 51 Z" fill="url(#goldGrad)"/>
    <path d="M30 51 V 25 C30 25 23 29 23 35 C23 42 30 51 30 51 Z" fill="#81C784"/>
    <path d="M30 52 V 17" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Clean Title: SRI VISESWARA NURSERY -->
  <text x="74" y="34" class="logo-title-main">SRI VISESWARA</text>
  <text x="75" y="53" class="logo-title-sub">NURSERY</text>
</svg>
